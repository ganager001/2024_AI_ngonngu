{% extends "custommer/base.html" %}
{% load static %}
{% block header %}

<link rel="stylesheet" href="{% static 'custommer/vendor/vendor/clockpicker/dist/bootstrap-clockpicker.min.css' %}">
<link rel="stylesheet"
    href="{% static 'custommer/vendor/vendor/bootstrap-colorpicker/dist/css/bootstrap-colorpicker.min.css' %}">

<link rel="stylesheet"
    href="{% static 'custommer/vendor/vendor/bootstrap-datepicker/dist/css/bootstrap-datepicker.min.css' %}">
<link rel="stylesheet" href="{% static 'custommer/vendor/vendor/bootstrap-daterangepicker/daterangepicker.css' %}">
{% endblock %}
{% block content %}
<div class="row">
    <div class="col-md-12">
        <div class="box box-block bg-white">
            <h5>Xử lý phân cụm theo thời gian</h5>
            <p class="font-90 text-muted mb-1">Lựa chọn thời gian để xử lý dữ liệu.</p>
            <form id="form-date">
                <div class="row">
                    <div class="col-md-6">
                        <div class="mb-1">
                            <h6>Thời gian bắt đầu</h6>
                            <div class="input-group">
                                <input type="text" name="start-date" class="form-control mydatepicker"
                                    placeholder="mm/dd/yyyy">
                                <span class="input-group-addon"><i class="fa fa-calendar-o"></i></span>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="mb-1">
                            <h6>Thời gian kết thúc</h6>
                            <div class="input-group">
                                <input type="text" name="end-date" class="form-control mydatepicker"
                                    placeholder="mm/dd/yyyy">
                                <span class="input-group-addon"><i class="fa fa-calendar-o"></i></span>
                            </div>
                        </div>
                    </div>
                </div>
                <button type="summit" class="btn btn-success w-min-md mb-0-25 waves-effect waves-light">Thực
                    hiện</button>
            </form>
        </div>
    </div>
</div>
<div id="loading-message" style="display: none;">
    <div class="box box-block py-1 bg-warning text-xs-center mb-1">
        <span class="arrow arrow-top arrow-warning"></span>
        Đang tải dữ liệu...
    </div>
</div>
<div id="data-container"></div>


{% endblock %}
{% block footer %}

<script type="text/javascript">
    $(document).ready(function () {
        // Xử lý khi form được submit
        $('#form-date').submit(function (event) {
            event.preventDefault();
            var data = $(this).serialize();
            $.ajax({
                url: '{% url "data_filter" %}',
                data: data,
                method: 'GET',
                beforeSend: function () {
                    // Hiển thị thông báo trước khi yêu cầu AJAX được gửi
                    $('#loading-message').show();
                },
                success: function (response) {
                    $('#data-container').html(response);
                    
                },
                error: function (xhr, status, error) {
                    $('#data-container').html('<p>Lỗi không có dữ liệu: ' + error + '</p>');
                },
                complete: function () {
                    // Ẩn thông báo khi yêu cầu AJAX hoàn tất
                    $('#loading-message').hide();
                    navlinkClick(); // Gắn lại sự kiện cho nav-link
                    attachToggleEvents(); // Gắn lại sự kiện cho toggle
                    $('.item-page').hide();
                    $('.item-page[data-page="1"]').show();
                    panigations(currentPage);
                }
            });
        });
        // Xử lý sự kiện cho nav-link
        function navlinkClick() {
            $('.nav-link').on('click', function (event) {
                event.preventDefault();

                var target = $(this).attr('href');

                // Remove active class from all nav-links and tab-panes
                $('.nav-link').removeClass('active');
                $('.tab-pane').removeClass('active show');

                // Add active class to the clicked nav-link and corresponding tab-pane
                $(this).addClass('active');
                $(target).addClass('active show');
            });
        }

        // Hàm để gắn các sự kiện toggle
        function attachToggleEvents() {
            const divs = document.querySelectorAll('.toggle-div');
            const contents = document.querySelectorAll('.toggle-content');

            divs.forEach((div, index) => {
                div.addEventListener('click', () => {
                    contents.forEach((content, contentIndex) => {
                        if (index === contentIndex) {
                            content.style.display = content.style.display === 'block' ? 'none' : 'block';
                        } else {
                            content.style.display = 'none';
                        }
                    });
                });
            });
        }
        // Gọi các hàm lần đầu tiên
        attachToggleEvents();
        navlinkClick();
        function loadPage(totalPage,page){
            let output = '';
            if (totalPage <= 5) {
                for (let i = 1; i <= totalPage; i++) {
                    let active = '';
                    if (page === i) {
                        active = 'active';
                    }
                    output += `<a class='page-link ${active}'>${i}</a>`;
                }
            } else {
                if (page <= 2) {
                    for (let i = 1; i <= 3; i++) {
                        let active = '';
                        if (page === i) {
                            active = 'active';
                        }
                        output += `<a class='page-link ${active}'>${i}</a>`;
                    }
                    output += "<a class='page-link continueLink'>...</a>";
                    output += `<a class='page-link'>${totalPage}</a>`;
                } else if (page <= totalPage - 5) {
                    for (let i = page; i <= page + 2; i++) {
                        let active = '';
                        if (page === i) {
                            active = 'active';
                        }
                        output += `<a class='page-link ${active}'>${i}</a>`;
                    }
                    output += "<a class='page-link continueLink'>...</a>";
                    output += `<a class='page-link'>${totalPage}</a>`;
                } else if (page <= totalPage - 2) {
                    for (let i = totalPage - 4; i <= totalPage; i++) {
                        let active = '';
                        if (page === i) {
                            active = 'active';
                        }
                        output += `<a class='page-link ${active}'>${i}</a>`;
                    }
                } else {
                    output += `<a class='page-link'>1</a>`;
                    output += "<a class='page-link continueLink'>...</a>";
                    for (let i = totalPage - 2; i <= totalPage; i++) {
                        let active = '';
                        if (page === i) {
                            active = 'active';
                        }
                        output += `<a class='page-link ${active}'>${i}</a>`;
                    }
                }
            }
            return output;
        }
        // phân trang
        var currentPage = 1;
        function showPagination(currentPage){
            $('.item-page').hide();
            $('.item-page[data-page="' + currentPage + '"]').show();
        }

        function showPageNumber(totalPage, currentPage){
            $('#page-numbers').html('');
            if(currentPage == 1)
            {
                $('#prev-page').addClass('pageDisabled');
                $('#first-page').addClass('pageDisabled');
                $('#next-page').removeClass('pageDisabled');
                $('#last-page').removeClass('pageDisabled');
            }
            else if(currentPage == totalPage)
            {
                $('#prev-page').removeClass('pageDisabled');
                $('#first-page').removeClass('pageDisabled');
                $('#next-page').addClass('pageDisabled');
                $('#last-page').addClass('pageDisabled');
            }
            else if(1 < currentPage < totalPage)
            {
                $('#prev-page').removeClass('pageDisabled');
                $('#first-page').removeClass('pageDisabled');
                $('#next-page').removeClass('pageDisabled');
                $('#last-page').removeClass('pageDisabled');
            }
            else{}
            $('#page-numbers').append(loadPage(totalPage, currentPage));
        }

        function panigations(currentPage){
            var totalPage = $('.item-page:last-child').attr('data-page');
            $('#page-numbers').append(loadPage(totalPage, currentPage));

            $('#page-numbers').on('click', 'a', function () {
                let page = parseInt($(this).html());
                currentPage = page;
                showPagination(page);
                showPageNumber(totalPage, page);
            });

            document.getElementById('first-page').addEventListener('click', function () {
                currentPage = 1;
                showPagination(currentPage);
                showPageNumber(totalPage, 1);
            });
            document.getElementById('prev-page').addEventListener('click', function () {
                currentPage = currentPage == 1 ? currentPage : --currentPage;
                showPageNumber(totalPage, currentPage);
                showPagination(currentPage);
            });
            document.getElementById('next-page').addEventListener('click', function () {
                let lastPage = $('.item-page:last-child').attr('data-page');
                currentPage ++;
                showPageNumber(totalPage, currentPage);
                showPagination(currentPage);
            });
            document.getElementById('last-page').addEventListener('click', function () {
                currentPage = $('.item-page:last-child').attr('data-page');
                showPageNumber(totalPage, currentPage);
                showPagination(currentPage);
            });

        }
        panigations(currentPage);
    });
</script>

<script type="text/javascript"
    src="{% static 'custommer/vendor/bootstrap-colorpicker/dist/js/bootstrap-colorpicker.min.js' %}"></script>
<script type="text/javascript"
    src="{% static 'custommer/vendor/clockpicker/dist/jquery-clockpicker.min.js' %}"></script>
<script type="text/javascript"
    src="{% static 'custommer/vendor/bootstrap-datepicker/dist/js/bootstrap-datepicker.min.js' %}"></script>
<script type="text/javascript" src="{% static 'custommer/vendor/moment/moment.js' %}"></script>
<script type="text/javascript"
    src="{% static 'custommer/vendor/bootstrap-daterangepicker/daterangepicker.js' %}"></script>
{% endblock%}
