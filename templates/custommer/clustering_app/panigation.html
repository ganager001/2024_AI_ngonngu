<div class="pagination">
    <span class="step-links">
        {% if page_obj.has_previous %}
        <a href="#" class="page-link" data-page="1">&laquo; Đầu</a>
        <a href="#" class="page-link" data-page="{{ page_obj.previous_page_number }}">Trước</a>
        {% endif %}
        {% for num in page_obj.paginator.page_range %}
        {% if num %}
        <a href="#" class="page-link" data-page="{{ num }}">{{ num }}</a> <!-- Liên kết đến các trang khác -->
        {% endif %}
        {% endfor %}
        {% if page_obj.has_next %}
        <a href="#" class="page-link" data-page="{{ page_obj.next_page_number }}">Sau</a>
        <a href="#" class="page-link" data-page="{{ page_obj.paginator.num_pages }}">Cuối &raquo;</a>
        {% endif %}
    </span>
</div>
